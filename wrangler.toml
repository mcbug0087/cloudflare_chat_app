name = "cloudflare-chat-app"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[d1_databases]
database_name = "chat-db"
database_id = "your-d1-database-id"

[[kv_namespaces]]
binding = "CHAT_KV"
id = "your-kv-namespace-id"

[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"
